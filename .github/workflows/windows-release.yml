name: Windows release

# Builds the Windows installer with scripts/Build-Release.ps1 on a Windows runner
# and publishes it as a GitHub release. It runs when a v* tag is pushed, or when
# started by hand with a tag name.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $installer = Get-ChildItem -Path artifacts/installer -Filter 'Fitlog-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The installer was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $notes = "Windows installer for Fitlog $env:TAG.`n`nSHA-256: $hash"
          gh release create $env:TAG $installer.FullName --title "Fitlog $env:TAG" --notes $notes
